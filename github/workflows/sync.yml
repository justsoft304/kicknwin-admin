name: Auto Sync KickNWin Predictions

on:
  repository_dispatch:
    types: [update_predictions]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "KickNWin Bot"
          git config user.email "bot@kicknwin.com"

      - name: Commit & Push updated predictions
        env:
          KICK_TOKEN: ${{ secrets.KICK_TOKEN }}
        run: |
          git add today_predictions.json past_predictions.json
          git commit -m "Auto-sync predictions from Dashboard" || echo "No changes"
          git push https://x-access-token:${{ secrets.KICK_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
