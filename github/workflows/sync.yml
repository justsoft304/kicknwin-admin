name: Sync KickNWin Predictions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "KickNWin Bot"
          git config user.email "bot@kicknwin.com"

      - name: Commit & Push updated JSONs
        env:
          GITHUB_TOKEN: ${{ secrets.KICK_TOKEN }}
        run: |
          git add today_predictions.json past_predictions.json
          git commit -m "Auto-sync predictions via Dashboard" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.KICK_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
