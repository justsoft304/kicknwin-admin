<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KickNWin Admin Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">⚽ KickNWin Admin Dashboard</span>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow p-4">
      <h4 class="mb-3 text-center">Add or Edit Prediction</h4>
      <form id="predictionForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input type="date" id="matchDate" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">League</label>
          <input type="text" id="league" class="form-control" placeholder="Premier League" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Confidence (%)</label>
          <input type="number" id="confidence" class="form-control" placeholder="e.g. 80" min="0" max="100">
        </div>
        <div class="col-md-6">
          <label class="form-label">Home Team</label>
          <input type="text" id="home" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Away Team</label>
          <input type="text" id="away" class="form-control" required>
        </div>
        <div class="col-md-12">
          <label class="form-label">Prediction</label>
          <input type="text" id="prediction" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="pending">Pending</option>
            <option value="win">Win</option>
            <option value="loss">Loss</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Save To</label>
          <select id="target" class="form-select">
            <option value="today">Today’s Predictions</option>
            <option value="past">Past Predictions</option>
          </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button class="btn btn-success w-100" type="submit">💾 Save & Sync</button>
        </div>
      </form>
    </div>

    <div class="mt-5">
      <h4 class="text-center mb-3">📋 All Predictions</h4>
      <div class="table-responsive">
        <table class="table table-striped align-middle" id="predictionTable">
          <thead class="table-dark">
            <tr>
              <th>Date</th>
              <th>League</th>
              <th>Home</th>
              <th>Away</th>
              <th>Prediction</th>
              <th>Conf%</th>
              <th>Status</th>
              <th>Target</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="text-center mt-4 p-3 bg-dark text-white">
    <small>KickNWin Admin © 2025</small>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
